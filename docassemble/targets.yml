# docassemble instances `make interview-deploy TARGET=<name>` and the
# docassemble-deploy workflow can install on. Each names its URL and the AWS
# Secrets Manager secret holding its DA_ADMIN_API_KEY; the key itself is read
# at deploy time and never stored. `local`, the local dev docassemble, isn't listed:
# it reads the repo's .env.

qa:
  url: https://qa.litigantportal.com/interview
  secret: k8s/qa-litigant/docassemble-env
  region: us-west-2
