sections:
  - kind: info
    id: overview
    heading: 'Responding to a civil traffic ticket in Scottsdale'
    body: |
      This page explains your options for a civil traffic ticket in Scottsdale City Court, what each one costs you, and the dates that matter.

      A civil traffic ticket is not a crime, but ignoring it has real consequences. If you do nothing by your court date, the case goes into default, fees are added, and your driving privileges can be suspended.

      You can resolve a civil ticket online, by phone, by mail, or in person, on or before your court date. You only go to court if you ask for a hearing.

      Nothing on this page is legal advice. It explains the process and the options people in your situation have.

  - kind: info
    id: before_you_start
    heading: 'Before you start'
    body: |
      Check three things on your ticket first.

      - Is it civil or criminal? This page covers civil traffic tickets only. If yours is criminal, see the section on criminal citations near the end of this page.
      - Has your court date already passed? If it has, skip to the section on missed court dates.
      - Is your case in the court's system yet? The police usually file a ticket with the court within 10 business days. Until then the court cannot find it, but you can still send paperwork and the court will hold it until the case arrives.

  - kind: fact_gather
    id: ticket_dates
    heading: 'Your ticket'
    questions:
      - id: traffic_violation_date
        label: 'Date of the violation'
        type: date
        help_text: 'Printed on your ticket. For a camera ticket, use the violation date on the notice, not the day it arrived in the mail.'
      - id: traffic_arraignment_date
        label: 'Your court date'
        type: date
        help_text: 'Printed on your ticket, sometimes called the arraignment date. Not sure? Look up your case online or call the court.'

  - kind: info
    id: your_options
    heading: 'Your three options'
    body: |
      You choose one of these, on or before your court date:

      - Take defensive driving school. If your ticket is eligible, finishing the class dismisses it.
      - Pay the fine. You accept responsibility and the case ends.
      - Request a hearing. You tell the court you are not responsible and a judge decides.

      Check defensive driving school first. Once a hearing starts, you can no longer choose the class.

  - kind: info
    id: defensive_driving
    heading: 'Option 1: Take defensive driving school'
    body: |
      Finishing a class at a defensive driving school certified by the Arizona Supreme Court dismisses one eligible ticket.

      You may be able to take defensive driving school if:
      - Your citation is civil, not criminal.
      - Your violation is on the list of eligible moving violations (A.R.S. 28-3392).
      - You haven't taken defensive driving school for a ticket whose violation date is within 12 months of this one.
      - The violation didn't involve a crash that caused serious injury or death.
      - You weren't driving a vehicle that requires a commercial driver license (CDL).

      This is a general check. The school you choose checks the state's records, and that check decides whether you're eligible.

      Deadline: you must finish the class at least 7 days before your court date.

      Need more time? Ask the court for a first, one-time extension. If your case meets the criteria, it is granted, and you must then finish the class 7 days before the new date on your notice, and give the school that new date. Any further extension is up to the judge, and you ask for it by filing a motion.

      To sign up, choose a school at azdrive.com or call 1-888-334-5565. Scottsdale is in Maricopa County, and its court number is 0751. The school needs a copy of your citation. If you lost yours, the court can send you a copy.

      What it costs: you pay everything to the school. The total is the school's own fee, a state fee, a $45 state surcharge, and Scottsdale's court diversion fee. Every certified school must post that total on its website. The amounts in effect on your violation date are the ones that apply.

  - kind: info
    id: pay
    heading: 'Option 2: Pay the fine'
    body: |
      Paying means you accept responsibility for the violation, and the case ends. The fine for each violation is on Scottsdale's bond card, linked below.

      To pay online, look up your case with the number part of your citation or your name (not both), choose your name, and enter the amount in the financial section. You can also pay by phone, by mail, or in person with a check, money order, or credit card.

      If you can't pay the full amount at once, ask for a payment plan through the Compliance Assistance Program. Fill out the Payment Plan Request form from the court's forms page, or call the court to set it up with a clerk.

      Paying does not keep the violation off your record. If your ticket is eligible for defensive driving school, that is the option that dismisses it.

  - kind: info
    id: hearing
    heading: 'Option 3: Request a hearing'
    body: |
      Requesting a hearing means you tell the court you are not responsible and ask a judge to decide. Make the request in person or in writing, on or before your court date, and the court sets a hearing date and notifies you.

      The hearing is your chance to present evidence: your own testimony, witnesses, written statements, diagrams, photographs, or anything else that matters to your case.

      The court keeps any evidence you submit until the appeal period ends, including a phone or other device if your evidence is on it. Print your photos and documents, or put them on a CD, before the hearing.

      On the day, go straight into the courtroom on your notice at the time listed, take a seat, and wait for your name. Do not take a number or wait in the lobby. Remove hats and sunglasses, and silence your phone.

      The judge decides by the preponderance of the evidence. If the state shows it is more likely than not that the violation happened, you are found responsible, and all fines and fees are due by the end of that day.

      Once the hearing starts, defensive driving school is no longer an option. If your ticket is eligible and you'd rather take the class, tell the hearing officer when your case is called.

      If you are found responsible for running a red light, including a flashing red, the Motor Vehicle Division will order you to complete Traffic Survival School. That is a separate class from defensive driving school.

      The court has a hearing information sheet in English and Spanish. Ask for it if you need it.

  - kind: info
    id: more_time
    heading: 'If you need more time or a new court date'
    body: |
      If you can't make your court date, ask the judge for a new one by filing a motion online. Look up your case, choose your name, select Online Motion Submission, and type your request with your phone number and email address.

      A judge usually rules within 48 to 72 hours, and you'll hear back faster if you include an email address. Filing a motion does not guarantee a new date, so file it as early as you can and check that it was ruled on. Your case page shows the status under Register of Actions, or you can call the court.

  - kind: info
    id: insurance_registration
    heading: 'If your ticket is for no proof of insurance or registration'
    body: |
      No proof of insurance: if you were insured at the date and time of the ticket, send proof to court@scottsdaleaz.gov and the charge can be dismissed. If you were not insured then, sending proof of 6 months of current insurance and a copy of your 39-month motor vehicle record may reduce the fine.

      No proof of registration: send a copy of your valid vehicle registration to court@scottsdaleaz.gov and the charge can be dismissed.

      The court processes proof within 2 business days, and a judge usually rules at least 4 days after you send it. Send it well before your court date.

  - kind: info
    id: photo_enforcement
    heading: 'If your ticket came from a camera (photo enforcement)'
    body: |
      Scottsdale uses cameras to catch speeding and red-light violations. The first thing you may get is a Notice of Violation. A notice is not a summons to appear in court. It says a vehicle registered to you was recorded in a violation.

      You can see the photos and video at ViolationInfo.com with the Notice number and PIN printed on your notice. Without internet access, call the Focus on Safety line at (844) 749-5996.

      If a complaint is filed with the court, your complaint packet lists a 30-day acknowledgement date and your court date. Respond by the acknowledgement date. If you don't, you may have to pay the cost of being served in person, your license may be suspended, and a default judgment may be entered.

      Your options for a camera complaint:
      - Option A, pay in full on or before your court date.
      - Option B, if you were not the driver, return the Option B coupon on page 2 of the complaint with a clear copy of the driver's government-issued photo ID. If the state agrees, your complaint is dismissed and a new one is sent to the driver. You are not required to identify the driver.
      - Option C, request a hearing by returning the Option C coupon. Mail it at least 5 working days before your court date. If attending would be a substantial hardship, you can ask in writing for a hearing decided on documents instead.
      - Option D, take defensive driving school if your ticket is eligible.

      If you only want to acknowledge the complaint and avoid the cost of being served, sign and return the Waiver of Service by email, fax, or mail to the court. You still need to resolve the complaint by your court date.

      If you are found responsible for, or pay, a red-light camera ticket, the Motor Vehicle Division will order you to complete Traffic Survival School.

  - kind: info
    id: criminal
    heading: 'If your citation is criminal, not civil'
    body: |
      This page covers civil traffic tickets only. Criminal traffic charges carry higher stakes and different rights, including the right to an attorney, and missing a criminal court date can lead to a warrant.

      Call Scottsdale City Court at (480) 312-2442 to confirm your court date and ask how to proceed. If you can't make the date, file a motion asking for a new one and send a copy to the City of Scottsdale Prosecutor's Office, 3700 North 75th Street, Suite B, fax (480) 312-7795.

  - kind: info
    id: missed_court_date
    heading: 'If you missed your court date'
    body: |
      If a civil ticket was not resolved by the court date, the case goes into default. That means a judgment has been entered for the State of Arizona, fees are added, and the court may report it to the Motor Vehicle Division, which can suspend your driving privileges.

      You can still resolve it. Your choices are:
      - Pay in full online or by phone.
      - Set up a payment plan through the Compliance Assistance Program. To qualify, make a payment with a clerk at (480) 312-2442 and sign a payment contract.
      - File a motion asking the judge for other options.

      Act quickly. A case left in default goes to a collection agency, which adds collection fees and can garnish your wages. It can also stop you from re-registering your vehicle in Arizona, and the court can have your Arizona tax refund or lottery winnings taken.

      If your registration won't renew or your license was suspended because of an unpaid ticket, start with the court. Once the court case is resolved, the court notifies the Motor Vehicle Division.

