# Each id is a citation target stored in user threads. Add ids, never rename them.
sections:
  - id: overview
    heading: 'Responding to an eviction in Franklin County'
    content: |
      This page is for tenants in Franklin County who received court papers for an eviction case and whose hearing has not happened yet. It explains how the case works in Franklin County Municipal Court and what you can do before and at your hearing.

      If you have only a notice or a warning from your landlord and nothing from the court, use the page for before an eviction case is filed. If your hearing date has passed, or you are not sure what happened at it, use the page for after an eviction judgment.

      Only a court can order you to leave your home. It is illegal for a landlord to change your locks, shut off your utilities, or put your belongings outside to force you out. If any of that is happening, call local law enforcement and a legal aid attorney right away, and keep receipts for anything it costs you. You may be able to recover that money.

      Nothing on this page is legal advice. It explains the process and the options people in this situation have, and free legal help is listed in the contacts at the end of this page.

  - id: notice_to_leave
    heading: 'Check the Notice to Leave your landlord gave you'
    content: |
      Before filing, your landlord must give you a written Notice to Leave (sometimes called a Notice to Vacate or a Three-Day Notice). Whether it was done correctly can matter at your hearing.

      The notice must include specific words required by Ohio law, usually in larger or bolder print: "You are being asked to leave the premises. If you do not leave, an eviction action may be initiated against you. If you are in doubt regarding your legal rights and obligations as a tenant, it is recommended that you seek legal assistance." A notice that changes these words may not be valid.

      It must be posted on your door, handed to you, or sent by certified mail at least three full days before the case was filed. The day it was posted does not count, and the last day cannot be a Sunday or legal holiday. A verbal warning is not a Notice to Leave.

      If you never received a notice, or it was missing the required words, tell the judge at your hearing and bring the notice if you have it.

      If a law enforcement officer tells you to move out without a court order, call a legal aid attorney immediately.

  - id: court_papers
    heading: 'If you received court papers'
    content: |
      If you stay past the notice deadline, your landlord can file an Eviction Complaint. The court then sends you a copy of the complaint and a paper titled Summons in Forcible Entry and Detainer that says when and where your hearing is. The papers can be mailed, handed to you or an adult in your household, or posted on your front door, and service must happen at least seven days before the hearing. In Franklin County, hearings are usually scheduled 14 to 21 days after filing.

      Most eviction complaints have two parts. The first cause of action asks for possession of your home; that is the eviction itself. The second cause of action, if the landlord included one, asks for money such as back rent, unpaid utilities, or damage. Read the complaint to see exactly what your landlord is asking for.

      The money claim runs on its own clock. If you dispute what the landlord says you owe, you must file a written Answer within 28 days of being served, even though the eviction hearing usually happens first. If you do not answer in time, the landlord can ask for a default judgment and the court can order the full amount without hearing your side.

      The 28 days start when service is complete, and that can be the day the court mailed the papers, before they reached you. Count from the earliest date you have, such as the mailing date or the day papers were posted on your door. If you are not sure, ask the clerk for your service date.

      Enter your dates below and the deadlines on this page update, with a calendar download further down.

  - id: defenses
    heading: 'Defenses you may have'
    content: |
      At the hearing, the judge decides whether the eviction is legally justified, and Ohio law lets you raise any defense at trial. A defense is a legal reason the eviction should not happen, backed by facts. Facts like these can matter:

      - Your landlord never gave you the Notice to Leave, or it was missing the required words.
      - You have rent receipts showing you paid.
      - Your landlord accepted rent after giving you the notice.
      - Your landlord regularly accepted late rent, then refused it without warning this time.
      - You offered the rent and it was refused.
      - You deposited your rent with the court clerk in a rent escrow case.
      - Your rent was late because of someone else's mistake, like a paycheck mailed to the wrong address.

      If you live in the city of Columbus and the case is only for unpaid rent, a city law called "pay to stay" may help. If you offer all the rent you owe before the judgment, plus reasonable late fees and the landlord's court costs, and your landlord refuses it, you can raise that refusal as a defense.

      Ohio law also does not allow a landlord to evict you because you complained about conditions. That is a defense you have to prove, and it does not apply if you are behind on rent. Franklin County often rejects it, so do not rely on it alone.

      Bad housing conditions alone are usually not a defense to unpaid rent. Hardship, like losing hours at work, is not a legal defense either, even though it is real.

      If the case includes a money claim and your landlord owes you money too, you can file an Answer and Counterclaim within the same 28 days, and the court can hear all of it at once. Common counterclaims are a security deposit the landlord kept without a reason (you may be owed double the amount wrongly kept), repairs you paid for, rent you overpaid, unfair late charges, and injuries caused by the landlord.

      Filing an Answer costs nothing. A counterclaim can carry a filing fee, and if you cannot afford it, the court has a fee waiver affidavit you can file instead. After you file, the court usually schedules a pretrial hearing for the money claim, and it may set mediation before a final hearing.

  - id: help_before_the_hearing
    heading: 'Free help before and at your hearing'
    content: |
      Legal Aid's Tenant Advocacy Project gives free representation to tenants in eviction cases and has a table at eviction court every morning. They can take only some cases. In Columbus, Legal Aid can represent tenants who meet its income limits and have children under 18 in the household. They may also help seniors, veterans, tenants with a disability that makes it hard to speak for themselves, groups of tenants in the same building, and anyone facing housing discrimination. Contact them before your hearing if you can.

      Community Mediation Services offers free mediation at a table at eviction court every day. Most eviction cases are about unpaid rent, and many landlords will agree to a payment plan or a later move-out date. Mediation can happen the same day as your hearing.

      The Self Help Center on the 16th floor can help you with forms and explain the process. They cannot give legal advice.

  - id: continuances
    heading: 'If you need to move your hearing'
    content: |
      Eviction cases move fast, and a case can go to trial at the first hearing. A continuance moves the hearing to a later date. Usually each side gets one, for about a week.

      There is almost never time to file a written request and get a ruling before the hearing. Instead, use the court's online emergency continuance request, which goes straight to the magistrates. It is listed in the resources at the end of this page.

      If you ask to delay the hearing by more than 8 days, Ohio law requires you to post a bond, usually the rent that will come due during the delay.

  - id: at_the_hearing
    heading: 'At your hearing'
    content: |
      Always go to your hearing, even if you plan to move out. If you do not appear and you were properly served, the case is decided without you. Arrive early and check in with the bailiff.

      A magistrate usually hears eviction cases. Your landlord speaks first and must show they own the property, that you had a rental agreement and broke it, that the problem is still going on if it is unpaid rent, that they gave you the Notice to Leave at least three full days before filing, and that you still live there. Then it is your turn. You can testify, bring witnesses, and show evidence such as your lease, rent receipts, the notice, and messages between you and your landlord. Bring printed copies.

      The magistrate usually decides at the hearing. If you win, the eviction is dismissed and you stay. If you lose, ask how much time you have to move. You have 14 days to object to a magistrate's decision. The page for after an eviction judgment explains that and your other options.

  - id: agreements
    heading: 'If you reach an agreement with your landlord'
    content: |
      Many eviction cases end with an agreement instead of a decision. In an Agreed Judgment Entry, you can stay in your home as long as you follow the terms, usually a payment plan. Some agreements instead enter a judgment against you that your landlord's attorney agrees to vacate if you pay or move out by a certain date.

      Read the terms carefully before you sign. You must follow them exactly. Paying even a few days late counts as breaking the agreement, and then your landlord can ask for a set out without another hearing.

      If you follow the agreement, it is usually up to you to contact your landlord's attorney and ask them to file the dismissal or the motion to vacate. They rarely do it on their own.

  - id: moved_out
    heading: 'If you already moved out'
    content: |
      If you move out before the hearing, you can ask the judge to dismiss the eviction claim as moot. That keeps a judgment for possession off your record, which matters for future rental applications.

      Return your keys to the landlord and try to get a receipt. Returning the keys is what legally returns the home. If the landlord will not give a receipt, bring the keys to the hearing and hand them over in front of the judge.

      At the hearing, tell the judge the date you moved out, that you returned the keys, and that you do not claim anything left behind, then ask that the claim for possession be dismissed as moot.

      A money claim in the same case does not go away when the eviction is dismissed. The 28-day Answer deadline still applies.

  - id: set_out
    heading: 'If the judge orders you to move'
    content: |
      If the judge rules for your landlord, the landlord can ask the court for a Writ of Restitution. The bailiff posts it on your door as a red tag. You then have 5 days, and after that your landlord can schedule the set out, when a bailiff removes you and your belongings. The set out must happen within 10 days of the writ.

      The page for after an eviction judgment explains how to ask the court to undo or pause the judgment, how the set out works, and how to remove the eviction from online records.

      You may be able to agree with your landlord on a move-out date instead. That saves the landlord the cost of the writ and gives you certainty about your timing. Put any agreement in writing.

# The guided page asks only the pages marked `on_page` (#1046).
interview:
  - title: 'Your key dates'
    on_page: true
    variables:
      - eviction_papers_received_date
      - eviction_hearing_date
  - title: 'Your case'
    description: 'These are on the Summons and the Complaint your landlord filed.'
    variables:
      - eviction_case_number
      - eviction_landlord_name
      - eviction_judge
  - title: 'Your name and contact information'
    description: 'This goes on your Answer so the court and your landlord can reach you.'
    variables:
      - first_name
      - middle_name
      - last_name
      - street_address
      - city
      - state
      - zip_code
      - phone_number
  # The defenses, in the order the Answer prints them, three or four to a
  # page: a long page of checkboxes is too much to take in at once.
  - title: 'Money you already paid'
    description: 'Check every one that is true for you. Each becomes a reason on your Answer for why you do not owe what the landlord says. You can check none.'
    variables:
      - eviction_defense_paid_in_full
      - eviction_defense_paid_in_part
      - eviction_paid_in_part_amount
      - eviction_defense_work_for_rent
  - title: 'Repairs and your security deposit'
    description: 'Check every one that is true for you. You can check none.'
    variables:
      - eviction_defense_repairs
      - eviction_repairs_amount
      - eviction_defense_deposit_not_credited
      - eviction_defense_deposit_withheld
      - eviction_security_deposit_amount
  - title: 'Late fees, damage, and other reasons'
    description: 'Check every one that is true for you. You can check none.'
    variables:
      - eviction_defense_late_charges
      - eviction_defense_no_damage
      - eviction_defense_other
      - eviction_defense_other_reasons
  - title: 'Who gets a copy'
    description: 'You must mail a copy of your Answer to your landlord, or to their attorney if they have one.'
    variables:
      - eviction_landlord_has_attorney
      - eviction_landlord_attorney_name
      - eviction_landlord_attorney_street
      - eviction_landlord_attorney_city
      - eviction_landlord_attorney_state
      - eviction_landlord_attorney_zip
      - eviction_landlord_street
      - eviction_landlord_city
      - eviction_landlord_state
      - eviction_landlord_zip
      - eviction_answer_mailed_date

# The filing packet.
packet:
  - form: fc-eviction-answer

deadlines:
  - id: answer_due
    label: 'Answer to a money claim is due'
    description: 'If the complaint includes a claim for money (a second cause of action), your written Answer must be filed within 28 days of the day service was complete, which can be the day the court mailed the papers. Count from the earliest date you have. If the last day falls on a weekend or holiday, you have until the next business day.'
    offset_days: 28
    offset_from: eviction_papers_received_date
  - id: hearing_day
    label: 'Your eviction hearing'
    description: 'The date, time, and location are on your summons. Arrive early and check in with the bailiff. If you do not appear, the case is decided without you.'
    offset_days: 0
    offset_from: eviction_hearing_date
