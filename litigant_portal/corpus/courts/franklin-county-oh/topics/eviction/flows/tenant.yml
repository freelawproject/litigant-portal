# Eviction (Franklin County, OH), TENANT role, once a case is filed and
# before the hearing. The directory locates the court and topic; the file
# name is the flow slug. Rebuilt (#1210) from the decision tree and the Self
# Help Center's training guides (kept in corpus-sources/franklin-county-oh/_local/).
# Before filing and after judgment are their own flows. The packet is the
# Self Help Center's Answer (#610), made fillable by
# scripts/fc_eviction_fillable.py.

name: 'Responding to an Eviction Case (Tenant)'
enabled: true
order: 1

# The page, top to bottom.
layout:
  - overview
  - court_papers
  - interview
  - notice_to_leave
  - defenses
  - packet
  - help_before_the_hearing
  - continuances
  - at_the_hearing
