# Franklin County (Columbus, OH) court-level content, scoped to the site
# data models (court fields on Site, Contact, Resource). Ported from the wip
# library's tenant and landlord eviction flows, contacts and resources merged
# across the two roles with role-specific notes neutralized.

name: 'Franklin County, Ohio'
court_name: 'Franklin County Municipal Court'
jurisdiction_level: county
state: OH
official_url: 'https://www.fcmcclerk.com'
official_resources_url: 'https://www.fcmcclerk.com/forms/civil'

# Each id is a citation target stored in user threads. Add ids, never rename them.
contacts:
  - id: court_clerk
    name: 'Franklin County Municipal Court Clerk'
    kind: clerk
    phone: '(614) 645-8186'
    url: 'https://www.fcmcclerk.com'
    address: '375 South High Street, Columbus, OH 43215'
    note: 'Filing questions, the fee schedule, and the public case search.'
  - id: self_help_center
    name: 'Franklin County Municipal Court Self Help Center'
    kind: self_help
    phone: '(614) 645-7381'
    address: '375 South High Street, 16th Floor, Columbus, OH 43215'
    hours: 'Monday to Friday, 9 a.m. to 3 p.m. (last visitor at 2:30 p.m.)'
    note: 'Help with court forms and the process for people who do not have a lawyer, in person or by webchat. They can notarize the eviction record removal application.'
  - id: rent_escrow_clerks
    name: 'FCMC Rent Escrow Clerks'
    kind: clerk
    phone: '(614) 645-7430'
    address: '375 South High Street, 3rd Floor, Columbus, OH 43215'
    hours: 'Monday to Friday, 8 a.m. to 4 p.m.'
    note: 'Start a rent escrow account here. Bring your rent in cash or money order and a copy of your written repair request. The clerks can notarize the application.'
  - id: duty_room
    name: 'FCMC Duty Room'
    phone: '(614) 645-3889'
    note: 'Call for updates on a motion or objection filed after an eviction judgment. The duty judge rules on these, usually within a few days.'
  - id: columbus_311
    name: 'City of Columbus Code Enforcement (311)'
    phone: '(614) 645-3111'
    url: 'https://311.columbus.gov'
    hours: 'Monday to Friday, 8 a.m. to 5 p.m.'
    note: 'Request a free inspection of unsafe or unrepaired conditions in a Columbus rental. Dial 3-1-1 from inside the city.'
  - id: columbus_tenant_hotline
    name: 'Columbus Code Enforcement tenant protection hotline'
    phone: '(614) 724-1532'
    note: 'For Columbus tenants: report retaliation after a repair complaint, a landlord refusing rent you offered, or a landlord who will not give receipts.'
  - id: homeless_hotline
    name: 'Franklin County Homeless Hotline'
    phone: '(614) 274-7000'
    note: 'Emergency shelter access in Franklin County.'
  - id: handson_211
    name: 'HandsOn Central Ohio'
    phone: '2-1-1'
    note: 'Around-the-clock referrals for food, shelter, and other help in Central Ohio.'
  - id: fabco
    name: 'FABCO'
    phone: '(614) 538-5600'
    address: 'PO Box 20850, Columbus, OH 43220'
    note: 'Local rental history and credit reporting company most Columbus landlords check. Request your free yearly report or dispute an error. Toll free: (800) 669-5010.'
  - id: service_bailiff
    name: "FCMC Service Bailiff's Office"
    phone: '(614) 645-7780'
    note: 'Arranges the set out after a judgment. The clerk sends your paperwork here; call to schedule.'
  - id: lasco
    name: 'Legal Aid of Southeast and Central Ohio (LASCO)'
    kind: legal_aid
    phone: '1-888-246-4420'
    url: 'https://www.lasco.org'
    note: 'Free legal help with noncriminal issues for people with low incomes, seniors, and veterans in 36 Ohio counties, including Franklin County. Apply by phone or through their website.'
  - id: urban_league
    name: 'Columbus Urban League'
    phone: '(614) 257-6300'
    note: "The court's FAQ points tenants here for information about tenant rights."
  - id: cba_referral
    name: 'Columbus Bar Association Lawyer Referral Service'
    kind: referral
    phone: '(614) 221-0754'
    note: 'The court points filers here to locate an attorney. Required if the property is owned by a corporation, LLC, or trust.'

resources:
  - id: orc_1923
    label: 'Ohio Revised Code Chapter 1923 (eviction law)'
    url: 'https://codes.ohio.gov/ohio-revised-code/chapter-1923'
    note: 'The state law eviction cases follow: notice, summons, hearing, and writ rules.'
  - id: fcmc_faq
    label: 'Franklin County Municipal Court Clerk eviction FAQ'
    url: 'https://www.fcmcclerk.com/faq/civil/evictions'
    note: "The clerk's answers about filing, service, hearing scheduling, and set outs, plus the public case search."
  - id: fcmc_civil_forms
    label: 'Franklin County Municipal Court civil forms'
    url: 'https://www.fcmcclerk.com/forms/civil'
    note: 'Court forms, including the fee waiver affidavit, a blank response form, and the application to ask that an eviction record be removed from online access.'
  - id: fcmc_case_search
    label: 'Franklin County Municipal Court Clerk case search'
    url: 'https://www.fcmcclerk.com/case/search'
    note: 'Look up your case by case number or name to see whether a judgment was entered or a writ was requested.'
  - id: fcmc_emergency_continuance
    label: 'Franklin County Municipal Court emergency continuance request'
    url: 'https://municipalcourt.franklincountyohio.gov/Departments-Services/Court-Attendance'
    note: "The court's online request to move an eviction hearing. It goes directly to the magistrates."
  - id: fc_auditor_search
    label: 'Franklin County Auditor property search'
    url: 'https://property.franklincountyauditor.com/_web/search/commonsearch.aspx?mode=owner'
    note: "Search your rental's address to find the owner's name and mailing address for a written repair request."
  - id: jfs_prc
    label: 'Franklin County JFS emergency assistance (PRC)'
    url: 'https://www.franklincountyohio.gov/Resident-Services/Support-Assistance/PRC-Emergency-Assistance/PRC-and-How-to-Apply'
    note: "Franklin County Job and Family Services' Prevention, Retention and Contingency program, which can help with rent in an emergency."
  - id: rentful_614
    label: 'Rentful 614'
    url: 'https://www.rentful614.com/rights'
    note: "Central Ohio renters' rights information, emergency vacate and relocation help, and housing search resources."
  - id: ohio_legal_help_record_removal
    label: 'Ohio Legal Help: Franklin County eviction record removal'
    url: 'https://www.ohiolegalhelp.org/letters-forms/franklin-county-application-remove-online-eviction-record'
    note: 'An online form builder for the application to remove an eviction record from online access in Franklin County.'
  - id: annual_credit_report
    label: 'AnnualCreditReport.com'
    url: 'https://www.annualcreditreport.com'
    note: 'Your free yearly credit reports from Equifax, Experian, and TransUnion.'
  - id: lasco_guides
    label: 'LASCO tenant guides on eviction'
    url: 'https://www.lasco.org/housing'
    note: 'Plain-language guides from Legal Aid of Southeast and Central Ohio: the five steps of eviction, notices to leave, illegal lockouts, answering a money claim, and getting a case dismissed after moving out.'
