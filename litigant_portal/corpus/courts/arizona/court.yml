# Arizona (statewide) court-level content, scoped to the site data models
# (court fields on Site, Contact, Resource). Civil traffic law and the
# decision tree apply statewide; the court that handles a case is the one
# named on the ticket, collected as the traffic_court fact (#1040). Only
# statewide contacts and resources live here. Sources:
# corpus-sources/arizona/SOURCE.md. Contacts match
# content/civil-traffic-options.yml; edit both together until #1012.
# LEGAL REVIEW REQUIRED.

name: 'Arizona'
court_name: 'Arizona Judicial Branch'
jurisdiction_level: state
state: AZ
# The Judicial Branch's own site, not a handling court's: that court varies
# by ticket and is the traffic_court fact.
official_url: 'https://www.azcourts.gov'

# Header art (#979): the Arizona Supreme Court seal, resized from the SME
# delivery (corpus-sources/arizona/branding/). The flow launches under the
# AOC's name.
branding:
  name: 'Arizona Supreme Court'
  logo: branding/logo.png

contacts:
  - id: driving_school_line
    name: 'Arizona defensive driving school line'
    phone: '1-888-334-5565'
    url: 'https://www.azdrive.com'
    note: 'An automated line listing the defensive driving schools certified by the Arizona Supreme Court.'
  - id: mvd
    name: 'Arizona Motor Vehicle Division'
    phone: '(602) 255-0072'
    url: 'https://azdot.gov/motor-vehicles'
    note: 'Traffic Survival School is ordered by the Motor Vehicle Division, not the court. Call them if you have been ordered to take it.'
  # TODO(source): an Arizona legal-aid / self-help contact (e.g. AZLawHelp, Community Legal Services) is not in the bundle; confirm before adding.

resources:
  - id: azcourts_drive
    label: "The Arizona Supreme Court's defensive driving program page"
    url: 'https://www.azcourts.gov/drive'
  - id: azdrive
    label: 'Find a certified defensive driving school (azdrive.com)'
    url: 'https://www.azdrive.com'
    note: 'Schools certified by the Arizona Supreme Court. You register and pay with the school directly.'
  - id: violationinfo
    label: 'See your camera photos and video (ViolationInfo.com)'
    url: 'https://www.violationinfo.com'
    note: 'If your camera notice lists this site, use the Notice number and PIN printed on the front of your notice.'
