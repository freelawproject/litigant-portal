interview:
  - title: 'Your ticket'
    variables:
      - traffic_violation_date
      - traffic_arraignment_date
  - title: 'How do you want to handle it?'
    description: 'This sets which deadlines and steps matter to you.'
    variables:
      - traffic_path # defensive_driving | pay | hearing  (TODO: value-list, #514)
  - title: 'A few details for the defensive driving pre-check'
    description: 'Informational only. The school does the binding eligibility check.'
    variables:
      - traffic_prior_violation_date # for the 12-month violation-to-violation rule
      - traffic_license_state
      - traffic_serious_injury_involved

deadlines:
  - label: 'Deadline to decide (your court date)'
    description: 'You must pay, register for defensive driving school, or request a hearing on or before this date. Missing it puts the case into default and can lead to a hold on your license or registration.'
    offset_days: 0
    offset_from: traffic_arraignment_date
  - label: 'Defensive driving school must be completed'
    description: 'If you chose defensive driving school, the class must be finished at least 7 days before your court date. If you were granted an extension, it is 7 days before the new date.'
    offset_days: -7
    offset_from: traffic_arraignment_date
