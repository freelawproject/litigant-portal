# Civil traffic (Arizona, statewide), "know my options" flow. The court
# that handles a case is the traffic_court fact, never assumed (#1040).
# The content/ copy renders the public page today and retires once the page
# renders from these rows (#1012). Sources and open SME questions are listed
# in that file's header. LEGAL REVIEW REQUIRED.
#
# Gates are info copy for now: the intro gates (civil vs criminal, court date
# passed) and the defensive driving screen become gated sections once the
# engine supports them (#970).
#
# Content rules: no em-dashes, one line per paragraph, never "official".

name: Know my options
enabled: true
order: 0

# The page in the order content/ shows it. No `packet`: this flow has no forms.
layout:
  - overview
  - before_you_start
  - interview
  - your_options
  - defensive_driving
  - pay
  - hearing
  - more_time
  - insurance_registration
  - photo_enforcement
  - criminal
  - missed_court_date
  - calendar
  - contacts
  - resources

sections:
  - id: overview
    heading: Responding to a civil traffic ticket in Arizona
    content: |
      This page explains your options for a civil traffic ticket in Arizona, what each one costs you, and the dates that matter. The court named on your ticket handles your case.

      A civil traffic ticket is not a crime, but ignoring it has real consequences. If you do nothing by your court date, the case goes into default, fees are added, and your driving privileges can be suspended.

      You resolve a civil ticket with your court, on or before your court date. You only go to court in person if you ask for a hearing. Your court can tell you how it accepts payments and requests.

      Nothing on this page is legal advice. It explains the process and the options people in your situation have.
  - id: before_you_start
    heading: Before you start
    content: |
      Check four things on your ticket first.

      - Which court is named on it? That court handles your case, and it is the one to contact with questions.
      - Is it civil or criminal? This page covers civil traffic tickets only. If yours is criminal, see the section on criminal citations near the end of this page.
      - Has your court date already passed? If it has, skip to the section on missed court dates.
      - Is your case in the court's system yet? A new ticket can take about 10 business days to reach the court's records. If your court can't find your case yet, check back, or ask the court what to do in the meantime.
  - id: your_options
    heading: Your three options
    content: |
      You choose one of these, on or before your court date:

      - Take defensive driving school. If your ticket is eligible, finishing the class dismisses it.
      - Pay the fine. You accept responsibility and the case ends.
      - Request a hearing. You tell the court you are not responsible and a judge decides.

      Check defensive driving school first. Once a hearing starts, you can no longer choose the class.
  - id: defensive_driving
    heading: 'Option 1: Take defensive driving school'
    content: |
      Finishing a class at a defensive driving school certified by the Arizona Supreme Court dismisses one eligible ticket.

      You may be able to take defensive driving school if:
      - Your citation is civil, not criminal.
      - Your violation is on the list of eligible moving violations (A.R.S. 28-3392).
      - You haven't taken defensive driving school for a ticket whose violation date is within 12 months of this one.
      - The violation didn't involve a crash that caused serious injury or death.
      - You weren't driving a vehicle that requires a commercial driver license (CDL).

      This is a general check. The school you choose checks the state's records, and that check decides whether you're eligible.

      Deadline: you must finish the class at least 7 days before your court date.

      Need more time? You can get one extension of your court date. Depending on your court, the school may be able to grant it. A school can't grant an extension if you ask less than 7 days before your court date, so ask the court instead. With an extension, you must finish the class at least 7 days before the new court date, and give the school that new date.

      To sign up, choose a school at azdrive.com or call 1-888-334-5565. The school needs a copy of your citation, which names your court. If you lost yours, ask your court for a copy.

      What it costs: you pay everything to the school. The total is the school's own fee, a state fee, a $45 state surcharge, and your court's diversion fee. Each court sets its own diversion fee. Every certified school must post that total on its website. The amounts in effect on your violation date are the ones that apply.
  - id: pay
    heading: 'Option 2: Pay the fine'
    content: |
      Paying means you accept responsibility for the violation, and the case ends. Your court can tell you the fine for your violation and the ways it accepts payment.

      If you can't pay the full amount at once, ask your court whether it offers a payment plan.

      Paying does not keep the violation off your record. If your ticket is eligible for defensive driving school, that is the option that dismisses it.

      If your ticket is for running a red light, including a flashing red, paying it means the Motor Vehicle Division will order you to complete Traffic Survival School. That is a separate class from defensive driving school.
  - id: hearing
    heading: 'Option 3: Request a hearing'
    content: |
      Requesting a hearing means you tell the court you are not responsible and ask a judge to decide. Ask your court for a hearing on or before your court date. The court sets a hearing date and notifies you.

      The hearing is your chance to present evidence: your own testimony, witnesses, written statements, diagrams, photographs, or anything else that matters to your case.

      Bring your evidence on paper, or on a CD for photos and video. The court may keep what you submit until the appeal period ends, so don't plan to hand over your phone.

      The judge decides by the preponderance of the evidence. If the state shows it is more likely than not that the violation happened, you are found responsible.

      Once the hearing starts, defensive driving school is no longer an option. If your ticket is eligible and you'd rather take the class, tell the judge when your case is called.

      If you are found responsible for running a red light, including a flashing red, the Motor Vehicle Division will order you to complete Traffic Survival School. That is a separate class from defensive driving school.
  - id: more_time
    heading: If you need more time or a new court date
    content: |
      If you can't make your court date, ask your court for a new one as early as you can. Your court can tell you how to ask. It is often a written request called a motion.

      Asking does not guarantee a new date. Check with your court that your request was granted before you miss the original date.
  - id: insurance_registration
    heading: If your ticket is for no proof of insurance or registration
    content: |
      No proof of insurance: if you were insured at the date and time of the ticket, send proof to your court. The charge may be dismissed.

      No proof of registration: send a copy of your valid vehicle registration to your court. The charge may be dismissed.

      Send proof well before your court date, and ask your court how it accepts it.
  - id: photo_enforcement
    heading: If your ticket came from a camera (photo enforcement)
    content: |
      Some Arizona cities use cameras to catch speeding and red-light violations. The first thing you may get is a Notice of Violation. A notice is not a summons to appear in court. It says a vehicle registered to you was recorded in a violation.

      Your notice explains how to see the photos and video. If it lists ViolationInfo.com, use the Notice number and PIN printed on it.

      If a complaint is filed with the court, follow the dates in your complaint packet. If you don't respond in time, you may have to pay the cost of being served in person, your license may be suspended, and a default judgment may be entered.

      Your choices for a camera complaint are the same three: pay, request a hearing, or take defensive driving school if your ticket is eligible. If you were not the driver, your complaint explains how to tell the court.

      If you are found responsible for, or pay, a red-light camera ticket, the Motor Vehicle Division will order you to complete Traffic Survival School.
  - id: criminal
    heading: If your citation is criminal, not civil
    content: |
      This page covers civil traffic tickets only. Criminal traffic charges carry higher stakes and different rights, including the right to an attorney, and missing a criminal court date can lead to a warrant.

      Contact the court named on your ticket to confirm your court date and ask how to proceed. If you can't make the date, ask the court for a new one as early as you can.
  - id: missed_court_date
    heading: If you missed your court date
    content: |
      If a civil ticket was not resolved by the court date, the case goes into default. That means a judgment has been entered for the State of Arizona, fees are added, and the court may report it to the Motor Vehicle Division, which can suspend your driving privileges.

      You can still resolve it. Contact your court as soon as you can to ask how to pay what you owe, whether a payment plan is available, or how to ask the judge for other options.

      Act quickly. A case left in default can go to a collection agency, which adds collection fees and can garnish your wages. It can also stop you from re-registering your vehicle in Arizona, and the court can have your Arizona tax refund or lottery winnings taken.

      If your registration won't renew or your license was suspended because of an unpaid ticket, start with the court. Once the court case is resolved, the court notifies the Motor Vehicle Division.
interview:
  - title: Your ticket
    variables:
      - traffic_court
      - traffic_violation_date
      - traffic_arraignment_date
deadlines:
  - id: court_date
    label: Your court date
    description: 'Pay or request a hearing on or before this date. Defensive driving school has an earlier deadline: the class must be finished 7 days before this date. If you do nothing, the case goes into default.'
    offset_days: 0
    offset_from: traffic_arraignment_date
  - id: school_deadline
    label: Finish defensive driving school
    description: If you choose defensive driving school, the class must be finished at least 7 days before your court date. With an extension, it is 7 days before the new date.
    offset_days: -7
    offset_from: traffic_arraignment_date
