# Declaration in Support of Petition, WAIVER track. Shares nd-name-change-declaration.pdf
# with nd-name-change-declaration; identical except §11 (waive instead of
# publish, with the reason checkboxes) and §12 (requesting waiver, Check
# Box14). Mappings ported from docassemble/nd-name-change/petition-waiver.yml;
# the shared Declaration fields were bench-confirmed on the standard track
# (#560), except the conviction table row noted below.

name: 'Declaration in Support of Petition'
file: nd-name-change-declaration.pdf

fields:
  # Caption
  - pdf_field: 'In District Court'
    template: '{county}'
  - pdf_field: 'Case No'
    template: ''
  - pdf_field: 'Petitioners current first middle if any and last legal name'
    template: '{first_name} {middle_name} {last_name}'
  # Preamble "I, ____ (current legal name)"
  - pdf_field: 'I'
    template: '{first_name} {middle_name} {last_name}'
  # 1. Current legal name
  - pdf_field: 'First name'
    template: '{first_name}'
  - pdf_field: 'Middle names if any'
    template: '{middle_name}'
  - pdf_field: 'Last name'
    template: '{last_name}'
  # 2. Citizenship (Check Box1 = citizen, Check Box2 = resident alien)
  - pdf_field: 'Check Box1'
    template: '{name_change_citizenship}'
    checked_when: 'citizen'
  - pdf_field: 'Check Box2'
    template: '{name_change_citizenship}'
    checked_when: 'resident_alien'
  # 3. "resident of North Dakota for ___ years and ___ months"
  - pdf_field: 'I have been a resident of North Dakota for'
    template: '{name_change_residency_years}'
  - pdf_field: 'years and'
    template: '{name_change_residency_months}'
  # 4. "resident of ___ County ... since ___ (month and year)"
  - pdf_field: 'I have been a resident of'
    template: '{county}'
  - pdf_field: 'month and year more than six months immediately before the'
    template: '{name_change_residence_since}'
  # 5. Place of birth
  - pdf_field: 'My place of birth is'
    template: '{place_of_birth}'
  # 6. Year of birth
  - pdf_field: 'My year of birth is'
    template: '{date_of_birth:%Y}'
  # 7. Requested name
  - pdf_field: 'First name_2'
    template: '{name_change_requested_first}'
  - pdf_field: 'Middle names if any_2'
    template: '{name_change_requested_middle}'
  - pdf_field: 'Last name_2'
    template: '{name_change_requested_last}'
  # 8. Reasons: litigant-handwritten narrative, left unmapped (parity w/ Petition).
  # 9. Criminal history (Check Box3 = never, Check Box4 = convicted)
  - pdf_field: 'Check Box3'
    template: '{name_change_criminal_history}'
    checked_when: 'none'
  - pdf_field: 'Check Box4'
    template: '{name_change_criminal_history}'
    checked_when: 'convicted'
  # 9. Conviction table, row 1: the gated conviction variables. Field names
  #    verified against the PDF's AcroForm field list; not yet bench-confirmed
  #    by a fill. Rows 2-6 are left for hand completion.
  - pdf_field: 'ChargeRow1'
    template: '{name_change_conviction_charge}'
  - pdf_field: 'ClassRow1'
    template: '{name_change_conviction_class}'
  - pdf_field: 'Name of CourtRow1'
    template: '{name_change_conviction_court}'
  - pdf_field: 'YearRow1'
    template: '{name_change_conviction_year}'
  # 11. Notice, WAIVER track: not published, blanks empty
  - pdf_field: 'Check Box7'
    template: ''
    checked_when: ''
  - pdf_field: 'Notice choose the same checkbox as Paragraph 11 of your Petition'
    template: ''
  - pdf_field: 'newspaper the official'
    template: ''
  - pdf_field: 'newspaper in'
    template: ''
  # 11. Waiver of publication + reason(s)
  - pdf_field: 'Check Box8'
    template: 'yes'
    checked_when: 'yes'
  - pdf_field: 'Check Box9'
    template: '{name_change_waiver_first_or_middle}'
    checked_when: 'True'
  - pdf_field: 'Check Box10'
    template: '{name_change_waiver_domestic_violence}'
    checked_when: 'True'
  # 12. Objections, WAIVER track: requesting waiver (Check Box14)
  - pdf_field: 'Check Box12'
    template: ''
    checked_when: ''
  - pdf_field: 'Check Box13'
    template: ''
    checked_when: ''
  - pdf_field: 'Check Box14'
    template: 'yes'
    checked_when: 'yes'
  # 13. Signature block, same one-row label shift as the standard track (shared
  #     declaration.pdf): 'Text15' = (Printed Name) line, 'Printed Name of
  #     Petitioner' = (Address / City, State, Zip) line, 'Address' = (Telephone /
  #     Email) line. The signature + "Signed on ___" blanks are handwritten.
  - pdf_field: 'Text15'
    template: '{first_name} {middle_name} {last_name}' # -> (Printed Name of Petitioner)
  - pdf_field: 'Printed Name of Petitioner'
    template: '{street_address}, {city}, ND {zip_code}' # -> (Address / City, State, Zip)
  - pdf_field: 'Address'
    template: '{phone_number}' # -> (Telephone Number / Email); no email collected
  # additional-sheets 'Check Box5'/'Check Box6' (¶8/¶9) stay off (Off on the bench).
