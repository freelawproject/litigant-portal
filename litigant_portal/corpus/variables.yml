# The variable glossary: every fact the app can ask a person, named once
# app-wide.
#
# Global variables are facts about the person, not about any topic. A
# variable is global when its answer means the same thing everywhere it is
# asked (a name, an address, a birth date), so any flow may reference it and
# every flow shares the stored answer. Their labels are context-free on
# purpose ("First name", not "Current first name"): the interview page a
# flow places a variable on supplies the context (e.g. "Your current legal
# name").
#
# Everything else is scoped and carries its topic as a name prefix
# (name_change_*, eviction_*), because it only means something inside that
# topic; the flows that share the topic share the variable. Default to
# scoped; promote a variable to global only when a second topic asks the
# identical question.
#
# A private variable identifies the person (a name, an address, a birth
# date, a conviction). Its answer is never shown back in a form, so a shared
# terminal can't replay one litigant's answer to the next.
#
# Labels and help text ported from the wip library flow configs, which took
# them from docassemble/nd-name-change/petition-*.yml and the legacy corpus.

variables:
  # ── Global ──────────────────────────────────────────────────────────────

  - name: first_name
    label: 'First name'
    private: true
    global: true
    required: true
    help_text: 'Your current legal name, as it appears on your ID.'

  - name: middle_name
    label: 'Middle name(s) (if any)'
    private: true
    global: true

  - name: last_name
    label: 'Last name'
    private: true
    global: true
    required: true

  - name: street_address
    label: 'Street address'
    private: true
    global: true
    required: true

  - name: city
    label: 'City'
    private: true
    global: true
    required: true

  - name: county
    label: 'County'
    private: true
    global: true
    required: true

  - name: zip_code
    label: 'ZIP code'
    private: true
    global: true
    required: true

  - name: date_of_birth
    label: 'Date of birth'
    private: true
    data_type: date
    global: true
    required: true

  - name: place_of_birth
    label: 'Place of birth'
    private: true
    help_text: 'e.g. Fargo, North Dakota'
    global: true
    required: true

  - name: phone_number
    label: 'Phone number'
    private: true
    global: true

  # ── Adult name change ───────────────────────────────────────────────────

  - name: name_change_requested_first
    label: 'Requested first name'
    private: true
    required: true

  - name: name_change_requested_middle
    label: 'Requested middle name(s) (if any)'
    private: true

  - name: name_change_requested_last
    label: 'Requested last name'
    private: true
    required: true

  - name: name_change_residence_since
    label: 'You have lived in this county since (month and year)'
    help_text: 'e.g. January 2025'
    required: true

  - name: name_change_citizenship
    label: 'Citizenship status'
    private: true
    data_type: choice
    required: true
    choices:
      - value: citizen
        label: 'U.S. citizen'
      - value: resident_alien
        label: 'Permanent resident alien'

  - name: name_change_criminal_history
    label: 'Criminal history'
    private: true
    question: 'Have you ever been convicted of a crime?'
    data_type: choice
    required: true
    choices:
      - value: none
        label: 'I have never been convicted of a crime'
      - value: convicted
        label: 'I have been convicted of a crime'

  # The four columns of the Declaration's conviction table (row 1). Only
  # asked when the answer above is "convicted"; litigants with more than one
  # conviction complete rows 2-6 of the table by hand.
  - name: name_change_conviction_charge
    label: 'Charge you were convicted of'
    private: true
    asked_when:
      variable: name_change_criminal_history
      value: convicted

  - name: name_change_conviction_class
    label: 'Class (felony or misdemeanor)'
    private: true
    asked_when:
      variable: name_change_criminal_history
      value: convicted

  - name: name_change_conviction_court
    label: 'Court that convicted you'
    private: true
    asked_when:
      variable: name_change_criminal_history
      value: convicted

  - name: name_change_conviction_year
    label: 'Year of conviction'
    private: true
    data_type: number
    asked_when:
      variable: name_change_criminal_history
      value: convicted

  - name: name_change_residency_years
    label: 'Years you have lived in North Dakota'
    data_type: number
    required: true

  - name: name_change_residency_months
    label: 'Additional months'
    data_type: number
    required: true
    default: 0

  # Standard (publication) track only.
  - name: name_change_publication_date
    label: 'Date the notice was published'
    private: true
    data_type: date
    help_text: 'Leave blank until your notice runs in the newspaper. Then enter it here and your deadline updates. Found on the affidavit of publication from the paper.'

  - name: name_change_publication_newspaper
    label: 'Newspaper name'
    required: true

  - name: name_change_publication_county
    label: 'County of publication'
    required: true

  # Waiver track only. The interview's select-every-reason instruction lives
  # on the interview page description in the waiver flow.
  - name: name_change_waiver_first_or_middle
    label: 'I am only changing my first or middle name'
    data_type: boolean

  - name: name_change_waiver_domestic_violence
    label: 'I am a victim of domestic violence'
    private: true
    data_type: boolean

  # Drives the fee-waiver form condition in both flows.
  - name: name_change_fee_waiver_needed
    label: 'I need to ask the court to waive the filing fee'
    question: 'The filing fee is $160. Do you need to ask the court to waive it?'
    data_type: boolean

  # ── Eviction ────────────────────────────────────────────────────────────
  # eviction_papers_received_date and eviction_hearing_date are asked on the
  # tenant flow, eviction_notice_served_date on the landlord flow.

  - name: eviction_papers_received_date
    label: 'Date you received the court papers'
    data_type: date
    help_text: 'The day the summons and complaint were handed to you, mailed to you, or posted on your door. This starts the 28-day window to answer a money claim. Not sure? Call the clerk with your case number and ask for the date you were served.'

  - name: eviction_hearing_date
    label: 'Your hearing date'
    data_type: date
    help_text: 'Printed on the Summons in Forcible Entry and Detainer. Enter it to add it to your calendar below.'

  - name: eviction_notice_served_date
    label: 'Date you served the Notice to Leave'
    data_type: date
    help_text: 'The day you handed the notice to your tenant, left it at the property, or sent it by certified mail.'

  # The tenant's Answer (#610): the caption, the defenses, and who it is
  # mailed to. The Answer's checkboxes are booleans, one per defense.

  - name: eviction_case_number
    label: 'Case number'
    private: true
    help_text: 'Printed at the top of the Summons and the Complaint. It starts with the year, then CVG.'

  - name: eviction_landlord_name
    label: "Your landlord's name"
    private: true
    help_text: 'Write it exactly as it appears after "Plaintiff" on the Complaint. It may be a company, not a person.'

  - name: eviction_judge
    label: 'Judge'
    help_text: "The judge's name, if one is printed on your court papers. Leave it blank if you can't find one."

  - name: eviction_defense_paid_in_full
    label: 'I already paid the landlord the money they say I owe'
    data_type: boolean

  - name: eviction_defense_paid_in_part
    label: 'I paid the landlord part of the money they say I owe'
    data_type: boolean

  - name: eviction_paid_in_part_amount
    label: 'How much you paid'
    data_type: number
    asked_when:
      variable: eviction_defense_paid_in_part
      value: true

  - name: eviction_defense_repairs
    label: 'I paid for repairs the landlord would not make'
    data_type: boolean

  - name: eviction_repairs_amount
    label: 'About how much the repairs cost'
    data_type: number
    asked_when:
      variable: eviction_defense_repairs
      value: true

  - name: eviction_defense_work_for_rent
    label: 'The landlord agreed I could do work instead of paying rent, and I did the work'
    data_type: boolean

  - name: eviction_defense_deposit_not_credited
    label: 'I paid a security deposit the landlord has not counted toward what I owe'
    data_type: boolean

  - name: eviction_defense_deposit_withheld
    label: 'The landlord wrongly kept my security deposit'
    data_type: boolean

  - name: eviction_security_deposit_amount
    label: 'Your security deposit'
    data_type: number

  - name: eviction_defense_late_charges
    label: 'The late fees are far more than the landlord lost from my paying late'
    data_type: boolean

  - name: eviction_defense_no_damage
    label: 'I did not damage the property beyond normal wear and tear'
    data_type: boolean

  - name: eviction_defense_other
    label: 'I have another reason'
    data_type: boolean

  - name: eviction_defense_other_reasons
    label: 'Your other reasons'
    asked_when:
      variable: eviction_defense_other
      value: true

  - name: eviction_answer_mailed_date
    label: 'Date you mailed a copy of your Answer'
    data_type: date
    help_text: 'You must mail a copy to your landlord, or to their attorney if they have one. Leave it blank until you mail it, then write the date on the form.'

  - name: eviction_landlord_has_attorney
    label: 'My landlord has an attorney'
    data_type: boolean
    help_text: "The Complaint lists the attorney under the landlord's name, if there is one."

  - name: eviction_landlord_attorney_name
    label: "Your landlord's attorney"
    asked_when:
      variable: eviction_landlord_has_attorney
      value: true

  - name: eviction_landlord_attorney_street
    label: "Attorney's street address"
    asked_when:
      variable: eviction_landlord_has_attorney
      value: true

  - name: eviction_landlord_attorney_city_state_zip
    label: "Attorney's city, state, and ZIP"
    asked_when:
      variable: eviction_landlord_has_attorney
      value: true

  - name: eviction_landlord_street
    label: "Landlord's street address"
    help_text: 'Where the landlord gets mail. The Complaint lists it under their name.'

  - name: eviction_landlord_city_state_zip
    label: "Landlord's city, state, and ZIP"

  # Arizona civil traffic. Scoped to the topic: an arraignment date and a
  # citation date mean something only inside a traffic case.

  - name: traffic_court
    label: 'The court named on your ticket'
    help_text: "Printed on your ticket, for example a city's municipal court or a county justice court. This court handles your case."

  - name: traffic_violation_date
    label: 'Date of the violation'
    data_type: date
    help_text: 'Printed on your ticket. For a camera ticket, use the violation date on the notice, not the day it arrived in the mail.'

  - name: traffic_arraignment_date
    label: 'Your court date'
    data_type: date
    help_text: 'Printed on your ticket, sometimes called the arraignment date. Not sure? Ask the court named on your ticket.'
