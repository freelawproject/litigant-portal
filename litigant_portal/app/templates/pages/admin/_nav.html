{% load i18n %}

{# Tab navigation — shared by the desktop left panel and the mobile drawer. #}
{# Tab styling is fully static via data-active variants so the pre-Alpine #}
{# paint matches — Alpine only toggles the attribute. #}
<nav class="flex-1 overflow-y-auto min-h-0 p-2 space-y-1">
  <button type="button"
          data-tab="settings"
          data-active
          x-on:click="selectTab"
          x-bind:data-active="tabActive.settings"
          class="flex items-center gap-2.5 w-full rounded-lg px-3 py-2 text-sm font-medium cursor-pointer select-none transition-colors border border-transparent text-greyscale-600 not-data-active:hover:bg-greyscale-100 data-active:border-primary-500 data-active:bg-white data-active:text-greyscale-900">
    <c-atoms.icon name="cog-6-tooth" class="w-4 h-4" />
    {% trans "Settings" %}
  </button>
  <button type="button"
          data-tab="knowledge"
          x-on:click="selectTab"
          x-bind:data-active="tabActive.knowledge"
          class="flex items-center gap-2.5 w-full rounded-lg px-3 py-2 text-sm font-medium cursor-pointer select-none transition-colors border border-transparent text-greyscale-600 not-data-active:hover:bg-greyscale-100 data-active:border-primary-500 data-active:bg-white data-active:text-greyscale-900">
    <c-atoms.icon name="book-open" class="w-4 h-4" />
    {% trans "Knowledge Base" %}
  </button>
  <button type="button"
          data-tab="users"
          x-on:click="selectTab"
          x-bind:data-active="tabActive.users"
          class="flex items-center gap-2.5 w-full rounded-lg px-3 py-2 text-sm font-medium cursor-pointer select-none transition-colors border border-transparent text-greyscale-600 not-data-active:hover:bg-greyscale-100 data-active:border-primary-500 data-active:bg-white data-active:text-greyscale-900">
    <c-atoms.icon name="users" class="w-4 h-4" />
    {% trans "Users" %}
  </button>
</nav>
