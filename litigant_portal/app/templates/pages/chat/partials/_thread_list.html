{% load i18n %}

{# Scrollable thread list — shared by the inline sidebar and the drawer. #}
{# Each row is a real link to ?thread=; selectThread intercepts the click. #}
<div class="flex-1 overflow-y-auto min-h-0 p-2 space-y-1">
  <template x-for="thread in threads" :key="thread.id">
    <c-molecules.thread-row live="1"
                            x-bind:href="thread.href"
                            x-bind:class="thread.rowClass"
                            x-bind:data-thread-id="thread.id"
                            x-on:click="selectThread" />
  </template>
  {% trans "Your chats will show here once you send a message." as empty_threads_text %}
  <div x-show="showEmpty" x-cloak>
    <c-molecules.empty-state icon="chat-bubble-left-right" text="{{ empty_threads_text }}" />
  </div>
</div>
