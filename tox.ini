[tox]
envlist = py{313}

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
extras = dev
setenv =
    DJANGO_SETTINGS_MODULE = litigant_portal.settings
    SECRET_KEY = test-secret-key-for-ci
    DEBUG = true
    POSTGRES_HOST = {env:POSTGRES_HOST:postgres}
    POSTGRES_PASSWORD = postgres
    CHAT_ENABLED = false
commands =
    manage makemigrations --check --dry-run
    pytest {posargs:--verbosity=1}

[testenv:fast]
# Non-DB tests only — no postgres required
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
extras = dev
setenv =
    DJANGO_SETTINGS_MODULE = litigant_portal.settings
    SECRET_KEY = test-secret-key-for-ci
    DEBUG = true
    POSTGRES_PASSWORD = postgres
    CHAT_ENABLED = false
commands = pytest -m "not postgres" {posargs:--verbosity=1}

[testenv:agent]
# Exercise the core without installing Django or initializing its settings.
runner = uv-venv-runner
package = skip
extras =
deps =
    pydantic>=2.0
    pytest>=8.0
setenv =
    PYTEST_DISABLE_PLUGIN_AUTOLOAD = 1
commands = python -m pytest -c lp_agent/pytest.ini lp_agent/tests {posargs}
