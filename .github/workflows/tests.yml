name: Tests

on:
  pull_request:
  # Exposes the test suite as a reusable workflow. Deployment workflows call
  # this instead of relying on a independent test run, keeping testing as
  # part of the deployment pipeline and avoiding duplicate executions.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: litigant_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    strategy:
      matrix:
        python-version:
          - '3.13'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system tox tox-uv

      - name: Run tox targets for ${{ matrix.python-version }}
        run: tox run -f py$(echo ${{ matrix.python-version }} | tr -d .)
