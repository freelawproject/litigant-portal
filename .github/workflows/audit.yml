name: Audit

# Checks the packages the image installs for known vulnerabilities; the
# script is scripts/audit_deps.sh.
on:
  pull_request:
  # Advisories are published on days with no PRs too.
  schedule:
    - cron: '17 6 * * *'
  # Deployment workflows call this before they build the image.
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script and its ignore list always come from this workflow's
      # commit. A deployed ref can be older than the script.
      - name: Check out the ref to audit
        if: ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Audit dependencies
        run: make audit PROJECT=${{ inputs.ref && 'target' || '.' }}
