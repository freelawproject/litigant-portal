name: Smoke

# Loads key pages of a published image in Chromium and sends one chat message;
# the suite is scripts/smoke/.
on:
  workflow_call:
    inputs:
      image:
        description: Image to test, e.g. freelawproject/litigant-portal:<sha>-prod
        required: true
        type: string
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        description: Bedrock API key the app answers the chat check with
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Deploys are serialized, so a hung job would hold every later deploy.
    timeout-minutes: 15
    env:
      IMAGE: ${{ inputs.image }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: litigant_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      # A caller that passes an unset repo secret passes an empty string.
      - name: Require Bedrock token
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          if [ -z "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            echo "::error::The AWS_BEARER_TOKEN_BEDROCK secret is empty. The chat check needs it to get a reply from Bedrock."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # DEBUG=true: with it off, static files come from S3 and plain HTTP
      # redirects to HTTPS. CORPUS_COURT stays unset so every court syncs.
      - name: Write app environment
        run: |
          cat > "$RUNNER_TEMP/app.env" <<'EOF'
          DEBUG=true
          SECRET_KEY=smoke-ci-not-a-secret
          POSTGRES_HOST=localhost
          POSTGRES_PASSWORD=postgres
          REDIS_URL=redis://localhost:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Migrate and sync corpus
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" "$IMAGE" manage migrate --noinput
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" "$IMAGE" manage sync_corpus --strict

      # compilemessages runs in the serving container because the .mo files it
      # writes live there. Prod's entrypoint runs it on every start, and nothing
      # else in CI does, so a .po that fails to compile is caught here.
      # -e with no value passes the token from the step env without writing it
      # to disk.
      - name: Start app
        id: start
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          docker run --detach --name app --network host --env-file "$RUNNER_TEMP/app.env" -e AWS_BEARER_TOKEN_BEDROCK "$IMAGE" \
            bash -c 'manage compilemessages && exec manage runserver 0.0.0.0:8000 --noreload'

      - name: Wait for /api/health/
        run: |
          deadline=$((SECONDS + 90))
          until curl --silent --fail --max-time 5 --output /dev/null http://localhost:8000/api/health/; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/health/ did not return 200 within 90 seconds. Last response:"
              curl --silent --show-error --include --max-time 5 http://localhost:8000/api/health/
              exit 1
            fi
            sleep 2
          done

      - name: Install Chromium
        run: uv run --project scripts/smoke --locked playwright install --with-deps chromium

      - name: Run smoke suite
        id: suite
        run: make smoke BASE_URL=http://localhost:8000

      # Artifact names cannot contain the image reference's ':' or '/'.
      - name: Name trace artifact
        id: artifact
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: echo "name=smoke-traces-${IMAGE##*:}" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright traces
        id: traces
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Link traces in summary
        if: ${{ !cancelled() && steps.traces.outcome == 'success' }}
        env:
          NAME: ${{ steps.artifact.outputs.name }}
          URL: ${{ steps.traces.outputs.artifact-url }}
        run: |
          echo "Playwright traces: download [$NAME]($URL), unzip it, and open a trace.zip with \`env -u VIRTUAL_ENV uv run --project scripts/smoke --locked playwright show-trace <trace.zip>\` or at https://trace.playwright.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: App logs
        if: ${{ failure() && steps.start.outcome == 'success' }}
        run: docker logs app
