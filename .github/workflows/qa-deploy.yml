name: Deploy to QA (EKS)

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Branch or tag to build and deploy to QA'
        required: true
        default: 'main'
      reset_db:
        description: 'Drop every table and rebuild the database from the deployed branch'
        type: boolean
        required: false
        default: true

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: courtlistener
  EKS_NAMESPACE: qa-litigant

permissions:
  contents: read

concurrency:
  group: litigant-qa-deploy
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ github.event.inputs.deploy_ref || github.sha }}

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.sha }}
      - name: Set shortcode
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        run: make push-image -e VERSION=${{ steps.vars.outputs.sha_short }} -e GIT_BRANCH="${{ github.event.inputs.deploy_ref || github.ref_name }}" -e BUILD_TIME="$(date -u +'%Y/%m/%d %H:%M')"

  setup-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Create Kubeconfig with AWS CLI
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Update Environment Variables
        env:
          LITIGANT_ENV: litigant-env
        run: kubectl annotate es $LITIGANT_ENV force-sync=$(date +%s) --overwrite -n ${{ env.EKS_NAMESPACE }} && kubectl wait es -n ${{ env.EKS_NAMESPACE }} --for=jsonpath="{.status.conditions[?(@.reason=='SecretSynced')].status}"=True --timeout=30s $LITIGANT_ENV

      - name: Reap Stale Temporary Pods
        run: kubectl delete pod -n ${{ env.EKS_NAMESPACE }} -l app=litigant-deploy-temp --ignore-not-found --timeout=60s

      - name: Launch Temporary Pod
        run: |
          kubectl run temp-pod-${{ needs.build.outputs.sha_short }} -n ${{ env.EKS_NAMESPACE }} --labels=app=litigant-deploy-temp --image=freelawproject/litigant-portal:${{ needs.build.outputs.sha_short }}-prod --restart Never --pod-running-timeout=120s --overrides='
          {
              "spec": {
              "containers": [{
                  "name": "temp-pod",
                  "image": "freelawproject/litigant-portal:${{ needs.build.outputs.sha_short }}-prod",
                  "command": ["/bin/sh", "-c", "trap : TERM INT; sleep 3600 & wait"],
                  "envFrom": [{
                  "secretRef": {
                      "name": "litigant-env"
                  }
                  }]
              }]
              }
          }'
      - name: Wait for Temporary Pod to Start
        run: kubectl wait pods -n ${{ env.EKS_NAMESPACE }} --for condition=Ready --timeout=90s temp-pod-${{ needs.build.outputs.sha_short }}

      - name: Collect Static Assets
        id: collectstatic
        run: kubectl exec -n ${{ env.EKS_NAMESPACE }} temp-pod-${{ needs.build.outputs.sha_short }} -- manage collectstatic --noinput --clear
      - name: Handle Collectstatic Error
        if: failure() && steps.collectstatic.conclusion == 'failure'
        run: |
          echo "collectstatic failed--aborting deploy"
          exit 1

      - name: Scale Down litigant-web
        id: scale_down
        if: ${{ inputs.reset_db }}
        run: |
          echo "WEB_REPLICAS=$(kubectl get deployment/litigant-web -n ${{ env.EKS_NAMESPACE }} -o jsonpath='{.spec.replicas}')" >> $GITHUB_ENV
          kubectl scale deployment/litigant-web -n ${{ env.EKS_NAMESPACE }} --replicas=0
          kubectl delete pod -n ${{ env.EKS_NAMESPACE }} -l service=litigant-web --ignore-not-found --timeout=120s

      - name: Reset Database
        if: ${{ inputs.reset_db }}
        run: |
          kubectl exec -i -n ${{ env.EKS_NAMESPACE }} temp-pod-${{ needs.build.outputs.sha_short }} -- manage shell <<'PY'
          from django.db import connection, transaction

          cursor = connection.cursor()
          cursor.execute("SET lock_timeout = 30000")
          cursor.execute("SELECT tablename FROM pg_tables WHERE schemaname = current_schema()")
          tables = [row[0] for row in cursor.fetchall()]
          with transaction.atomic():
              for table in tables:
                  cursor.execute("DROP TABLE IF EXISTS " + connection.ops.quote_name(table) + " CASCADE")
          print("Dropped", len(tables), "tables")
          PY

      - name: Apply Migrations
        id: migrate
        run: kubectl exec -n ${{ env.EKS_NAMESPACE }} temp-pod-${{ needs.build.outputs.sha_short }} -- manage migrate --noinput
      - name: Handle Migration Error
        if: failure() && steps.migrate.conclusion == 'failure'
        run: |
          echo "Migrations failed. Open a shell into pod temp-pod-${{ needs.build.outputs.sha_short }} to investigate."
          echo "It stops running after an hour but is kept around for debugging; the next deploy reaps it."
          exit 1

      - name: Sync Corpus
        run: kubectl exec -n ${{ env.EKS_NAMESPACE }} temp-pod-${{ needs.build.outputs.sha_short }} -- manage sync_corpus --strict

      - name: Bootstrap Superuser
        run: kubectl exec -n ${{ env.EKS_NAMESPACE }} temp-pod-${{ needs.build.outputs.sha_short }} -- manage bootstrap_superuser

      - name: Scale Up litigant-web
        if: ${{ always() && steps.scale_down.conclusion != 'skipped' }}
        run: kubectl scale deployment/litigant-web -n ${{ env.EKS_NAMESPACE }} --replicas=${WEB_REPLICAS:-1}

      - name: Delete Temporary Pod
        run: kubectl delete pod -n ${{ env.EKS_NAMESPACE }} temp-pod-${{ needs.build.outputs.sha_short }}

  deploy-web:
    needs: [build, setup-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Create Kubeconfig with AWS CLI
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Rollout litigant-web
        run: kubectl set image -n ${{ env.EKS_NAMESPACE }} deployment/litigant-web web=freelawproject/litigant-portal:${{ needs.build.outputs.sha_short }}-prod
      - name: Watch litigant-web rollout status
        run: kubectl rollout status -n ${{ env.EKS_NAMESPACE }} deployment/litigant-web
