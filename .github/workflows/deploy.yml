name: Build and Push to Docker Hub

# Builds and publishes the portal image for every merge to `main`.
#
# This workflow composes the reusable test workflow into the publish pipeline,
# making a successful test run a prerequisite for publishing instead of relying
# on an independent workflow.
#
# EKS deployment will be added in a follow-up once AWS authentication is ready.
on:
  push:
    branches:
      - main

# github-script lists the PR associated with the merge commit; that needs
# pull-requests: read. contents: read is for checkout.
permissions:
  contents: read
  pull-requests: read

# Serialize publishes so back-to-back merges push image tags in order.
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

jobs:
  # Runs even when the publish is labelled off. `build` needs it, so a red
  # suite stops the publish.
  tests:
    uses: ./.github/workflows/tests.yml

  get-pr-labels:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.find_pr.outputs.labels }}
    steps:
      - name: Find merged PR for this commit
        id: find_pr
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commitSha = context.sha;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              sort: "updated",
              direction: "desc",
              per_page: 1
            });

            const pr = prs.find(p => p.merge_commit_sha === commitSha);
            if (!pr) {
              core.setOutput("labels", "");
              core.warning("No merged PR found for this commit.");
              return;
            }

            const labels = pr.labels.map(l => l.name);
            core.setOutput("labels", labels.join(","));
            console.log(`PR #${pr.number} labels: ${labels.join(", ")}`);

  build:
    needs: [tests, get-pr-labels]
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.get-pr-labels.outputs.labels, 'skip-deploy') }}
    steps:
      - uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        run: make push-image -e VERSION=$(git rev-parse --short HEAD)
