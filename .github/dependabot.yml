version: 2

# Everything runs monthly, matching the rest of the org (courtlistener,
# juriscraper, x-ray, courts-db, reporters-db, recap-chrome). Security updates
# are driven by advisories + the dependency graph and fire regardless of this
# file; what lives here is version updates, which exist to keep pinned
# dependencies from going stale.
updates:
  # SHA-pinned actions go stale silently — the pin is the point, so nothing
  # tells us a newer release exists.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One grouped PR instead of one per action.
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: build(deps)

  # Python dependencies: pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - '*'
    ignore:
      # Patch bumps across the whole dependency tree are more noise than signal;
      # a security advisory still comes through regardless of this filter.
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    commit-message:
      prefix: build(deps)

  # Pre-commit hook revisions are pinned the same way actions are, and drift the
  # same way. Version updates only: pre-commit has no security-update support,
  # and it does not work on private repositories (this one is public).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns:
          - '*'
    commit-message:
      prefix: build(deps)
