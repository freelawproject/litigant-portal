court_name: Fictional Ohio Court of Common Peas and Poultry
topic_title: Chicken Displacement Protection (fictional evaluation fixture)
flow_name: Habeas Cluckus — tenant and landlord information
sections:
  - heading: Fictional law, for this evaluation only
    content: |
      This entire guide is invented. It is not Ohio law and must not be
      presented as real legal information outside this fictional exercise.
      The Ohio Chicken Displacement Protection Act of 1887 is designated
      mock OH Rev Code § 904.01(COOP). This citation exists only in this fixture.
  - heading: The unusually spacious chicken rule
    content: |
      For this fictional rule, divide the coop's total floor area in square
      feet by the number of chickens. If the result is at least 200 square
      feet per chicken, the Act's protection applies. Exactly 200 qualifies.
      Below 200, this Act's special petition is not required. That says
      nothing about other eviction requirements, which this guide does not cover.
      The rule is the same whether the question comes from a tenant or landlord.
  - heading: A landlord's petition and the tenant's protection
    content: |
      When protection applies, the landlord must first file a Habeas Cluckus
      petition to override the protection, then attend Coop Conciliation,
      and then wait for the fictional court to grant it before displacing
      the chickens. Filing alone does not end protection.
      The petition filing fee is $42.00. No other fee, deadline, exception,
      or eligibility rule is specified here. The fictional Poultry Clerk can
      explain this process; a fictional legal aid lawyer can help either party
      choose a strategy. The guide supplies information, not a recommendation
      to evict or resist eviction.
