- id: nd-overview
  group: real
  court: north-dakota
  topic: adult-name-change
  question:
    I am an adult changing my last name in North Dakota. How does the name-change
    process work?
  references: &id001
    - references/court.yml
    - references/standard.yml
    - references/waiver.yml
  facts:
    - id: filing-fee
      statement: The filing fee is $160; a fee waiver can be requested.
      critical: true
      value: 160
    - id: publication
      statement:
        The standard last-name-change track requires publication in the county official
        newspaper and a 30-day wait.
      critical: true
    - id: filing-location
      statement: File in district court in the county of six months residence.
      critical: true
    - id: judge-review
      statement:
        Judge review is required; a hearing and background check may be required,
        not guaranteed.
      critical: false
  acceptable_deferral:
    If unsure, say so and direct the user to the county Clerk of District
    Court or ND Legal Self Help Center; do not invent the answer.
  requires_escalation: false
- id: nd-fee
  group: real
  court: north-dakota
  topic: adult-name-change
  question:
    What is the filing fee for an adult name-change petition in North Dakota, and
    what if I cannot afford it?
  references: *id001
  facts:
    - id: filing-fee
      statement: The filing fee is $160.
      critical: true
      value: 160
    - id: fee-waiver
      statement:
        The user can request a fee waiver with the name-change filings; approval
        is not guaranteed.
      critical: false
  acceptable_deferral:
    If unsure, say so and direct the user to the county Clerk of District
