  references: *id001
  facts:
    - id: county-newspaper
      statement: The standard track uses the county official newspaper, not any newspaper.
      critical: true
    - id: waiting-period
      statement: The standard publication waiting period is 30 days.
      critical: true
      value: 30
  acceptable_deferral:
    If unsure, say so and direct the user to the county Clerk of District
