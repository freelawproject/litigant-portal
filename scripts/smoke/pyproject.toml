[project]
name = "litigant-portal-smoke"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-rerunfailures>=16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--reruns 1 --browser chromium --tracing on"
